<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .form-input {
            @apply w-full px-4 py-3 rounded-lg border border-outline-variant bg-surface-container-lowest text-on-surface font-body-md focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors duration-200;
        }
        .form-label {
            @apply block text-on-surface-variant font-label-md mb-xs;
        }
        .card-shadow {
            box-shadow: 0 4px 16px -4px rgba(0, 0, 0, 0.04);
        }
        .card-shadow:hover {
            box-shadow: 0 8px 32px -8px rgba(0, 0, 0, 0.08);
            transform: translateY(-2px);
        }
    </style>
</head>
<body class="bg-surface min-h-screen flex flex-col font-body-md text-on-surface">
<!-- Header (Minimal for Auth) -->
<header class="w-full bg-surface-container-lowest border-b border-outline-variant py-md px-gutter">
<div class="max-w-container-max mx-auto flex items-center justify-between">
<a class="font-headline-md text-primary font-bold" href="#">TechHub PC</a>
<a class="text-on-surface-variant font-label-md hover:text-primary transition-colors flex items-center gap-base" href="#">
<span class="material-symbols-outlined text-[20px]">arrow_back</span>
                Quay lại cửa hàng
            </a>
</div>
</header>
<!-- Main Content -->
<main class="flex-grow flex items-center justify-center py-xl px-gutter md:px-lg">
<div class="w-full max-w-5xl grid grid-cols-1 md:grid-cols-2 gap-lg relative">
<!-- Separator (Desktop only) -->
<div class="hidden md:block absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 h-[80%] w-px bg-outline-variant z-0"></div>
<!-- Login Card -->
<div class="bg-surface-container-lowest rounded-xl p-lg border border-outline-variant card-shadow transition-transform duration-300 relative z-10">
<div class="mb-lg">
<h2 class="font-headline-lg text-on-surface mb-xs">Đăng nhập</h2>
<p class="font-body-sm text-on-surface-variant">Chào mừng bạn quay trở lại TechHub PC.</p>
</div>
<form class="space-y-md">
<div>
<label class="form-label" for="login-email">Email / Số điện thoại</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline-variant">person</span>
<input class="form-input pl-10" id="login-email" placeholder="Nhập email hoặc số điện thoại" required="" type="text"/>
</div>
</div>
<div>
<div class="flex justify-between items-center mb-xs">
<label class="block text-on-surface-variant font-label-md" for="login-password">Mật khẩu</label>
<a class="font-label-md text-primary hover:underline" href="#">Quên mật khẩu?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline-variant">lock</span>
<input class="form-input pl-10 pr-10" id="login-password" placeholder="Nhập mật khẩu" required="" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-outline-variant hover:text-on-surface" type="button">
<span class="material-symbols-outlined">visibility_off</span>
</button>
</div>
</div>
<div class="flex items-center gap-sm mt-sm mb-lg">
<input class="rounded border-outline-variant text-primary focus:ring-primary w-4 h-4 cursor-pointer" id="remember-me" type="checkbox"/>
<label class="font-body-sm text-on-surface-variant cursor-pointer" for="remember-me">Ghi nhớ đăng nhập</label>
</div>
<button class="w-full bg-primary text-on-primary font-label-lg py-3 rounded-lg hover:bg-primary-container transition-colors duration-200 flex justify-center items-center gap-sm" type="submit">
                        Đăng nhập
                        <span class="material-symbols-outlined text-[20px]">login</span>
</button>
</form>
<div class="mt-lg">
<div class="relative flex items-center justify-center">
<span class="absolute w-full border-t border-outline-variant"></span>
<span class="relative bg-surface-container-lowest px-sm font-label-md text-on-surface-variant">Hoặc đăng nhập với</span>
</div>
<div class="grid grid-cols-2 gap-sm mt-md">
<button class="flex items-center justify-center gap-sm py-2 border border-outline-variant rounded-lg hover:bg-surface-container-low transition-colors">
<img class="w-5 h-5 object-contain" data-alt="A clean, minimalist logo of Google on a white background, suitable for a modern e-commerce login button. The style is sharp and corporate." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAm4yN2a_7YSiKm-CbxYuHObCTMesA027xi2WeW7CH8t0lqq-49_fQ7rcgNmpkPzK0rEJdHHY-omel_kdQsuL66pjS8SjcArCXKdROfLSMfGZq-DqxhlpZ_-9WmpgfWMgX8zVMpOHdFgvmPtRsB82zv7o3B1KGdtRfk6TSQ6dYG0ZOAZuoHIFQt93IlyZWfLrwnSTx00-J26UpRrRT7NTk2Y2r4bFQeMBQgtm664VKHJ2sdO9kzzAFfEQ"/>
<span class="font-label-md text-on-surface">Google</span>
</button>
<button class="flex items-center justify-center gap-sm py-2 border border-outline-variant rounded-lg hover:bg-surface-container-low transition-colors">
<img class="w-5 h-5 object-contain" data-alt="A clean, minimalist logo of Facebook on a white background, suitable for a modern e-commerce login button. The style is sharp and corporate." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDXB4NnPQFY_289yF8S5ScSuT5ML0UOBVIcbFdOhhULgM3AE4s-pchn1YqYEXTo3PpPAgcfKDlD_vDJhGijqCIlsTfbqbubtIGXDN20Bcp8ge1cmzohBxWfvV5T9KRBRg4FfwShhOuSDDMg0uhbna-u_nkRDGA8tbgfexIKCgn64PCpTv7-RvLjnhqVfR2J7vsebPggQ6a-uTs73d1XXhOpWyFfhlfTgFi4CTOhjvWFrnoj02z5Fgnt7g"/>
<span class="font-label-md text-on-surface">Facebook</span>
</button>
</div>
</div>
</div>
<!-- Register Card -->
<div class="bg-surface-container-lowest rounded-xl p-lg border border-outline-variant card-shadow transition-transform duration-300 relative z-10">
<div class="mb-lg">
<h2 class="font-headline-lg text-on-surface mb-xs">Đăng ký</h2>
<p class="font-body-sm text-on-surface-variant">Tạo tài khoản để nhận ưu đãi đặc quyền.</p>
</div>
<form class="space-y-md">
<div>
<label class="form-label" for="reg-name">Họ và tên</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline-variant">badge</span>
<input class="form-input pl-10" id="reg-name" placeholder="Nhập họ và tên đầy đủ" required="" type="text"/>
</div>
</div>
<div>
<label class="form-label" for="reg-email">Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline-variant">mail</span>
<input class="form-input pl-10" id="reg-email" placeholder="Nhập địa chỉ email" required="" type="email"/>
</div>
</div>
<div>
<label class="form-label" for="reg-phone">Số điện thoại</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline-variant">phone_iphone</span>
<input class="form-input pl-10" id="reg-phone" placeholder="Nhập số điện thoại" required="" type="tel"/>
</div>
</div>
<div>
<label class="form-label" for="reg-password">Mật khẩu</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline-variant">lock</span>
<input class="form-input pl-10 pr-10" id="reg-password" placeholder="Tạo mật khẩu (ít nhất 8 ký tự)" required="" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-outline-variant hover:text-on-surface" type="button">
<span class="material-symbols-outlined">visibility_off</span>
</button>
</div>
</div>
<div class="flex items-start gap-sm mt-sm mb-lg">
<input class="rounded border-outline-variant text-primary focus:ring-primary w-4 h-4 cursor-pointer mt-1" id="terms" required="" type="checkbox"/>
<label class="font-body-sm text-on-surface-variant cursor-pointer" for="terms">
                            Tôi đồng ý với <a class="text-primary hover:underline" href="#">Điều khoản dịch vụ</a> và <a class="text-primary hover:underline" href="#">Chính sách bảo mật</a> của TechHub PC.
                        </label>
</div>
<button class="w-full bg-surface-container text-on-surface font-label-lg py-3 rounded-lg border border-outline-variant hover:border-primary hover:text-primary transition-colors duration-200 flex justify-center items-center gap-sm" type="submit">
                        Tạo tài khoản mới
                        <span class="material-symbols-outlined text-[20px]">person_add</span>
</button>
</form>
</div>
</div>
</main>
<!-- Footer (Minimal) -->
<footer class="w-full py-md px-gutter bg-surface-container-lowest border-t border-outline-variant text-center">
<p class="font-body-sm text-on-surface-variant">© 2024 TechHub PC. Tất cả quyền được bảo lưu.</p>
</footer>
</body></html>
